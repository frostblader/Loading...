<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timed File Line Display</title>
    <style>
        #container {
            font-family: Arial, sans-serif;
            font-size: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="container">Loading...</div>

    <script>
        let lines = [];
        let currentLine = 0;

        // Fetch the text file
        fetch("./data.txt")
            .then(response => response.text())
            .then(text => {
                lines = text.split(/\r?\n/).map(line => line.trim()).filter(line => line !== ""); // Trim and remove blank lines
                currentLine = 0;
                displayLine();
                startTimer();
            })
            .catch(error => console.error("Error loading file:", error));

        function displayLine() {
            if (lines.length > 0) {
                // If the current line contains "jaamees baaxteer", reset without displaying it
                if (lines[currentLine].includes("jaamees baaxteer")) {
                    currentLine = 0; // Loop back to the beginning instantly
                } else {
                    document.getElementById("container").textContent = lines[currentLine];
                    currentLine = (currentLine + 1) % lines.length; // Move to the next line
                }
            }
        }

        function startTimer() {
            setInterval(displayLine, 2000); // Change line every 2 seconds
        }
    </script>

</body>
</html>
