<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timed File Line Display</title>
    <style>
        #container {
            font-family: Arial, sans-serif;
            font-size: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="container">Loading...</div>

    <script>
        let lines = [];
        let currentLine = 0;

        // Fetch the text file
        fetch("./data.txt")
            .then(response => response.text())
            .then(text => {
                lines = text.split(/\r?\n/);
                currentLine = 0;
                displayLine();
                startTimer();
            })
            .catch(error => console.error("Error loading file:", error));

       function displayLine() {
    // Ensure currentLine points to a valid non-empty line
    while (currentLine < lines.length && lines[currentLine].trim() === "") {
        currentLine++; // Skip empty lines
    }

    // Display the current line
    document.getElementById("container").textContent = lines[currentLine];

    // Check if "jaamees baaxteer" is found and restart if needed
    if (lines[currentLine].includes("jaamees baaxteer")) {
        currentLine = 0;
    } else {
        currentLine = (currentLine + 1) % lines.length;
    }
}


        function startTimer() {
            setInterval(displayLine, 2000); // Change line every 2 seconds
        }
    </script>

</body>
</html>
