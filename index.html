<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timed File Line Display</title>
    <style>
        #container {
            font-family: Arial, sans-serif;
            font-size: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="container">Loading...</div>

    <script>
        let lines = [];
        let currentLine = 0;

        // Fetch the text file
        fetch("./data.txt")
            .then(response => response.text())
            .then(text => {
                lines = text.split(/\r?\n/).map(line => line.trim()).filter(line => line !== ""); // Clean up blank lines
                console.log("Loaded lines:", lines); // Debugging output
                currentLine = 0;
                displayLine();
                startTimer();
            })
            .catch(error => console.error("Error loading file:", error));

        function displayLine() {
            if (lines.length > 0) {
                // Skip "jaamees baaxteer" BEFORE displaying anything
                if (lines[currentLine].includes("jaamees baaxteer")) {
                    currentLine = 0; // Restart instantly
                }

                // Display current line
                document.getElementById("container").textContent = lines[currentLine];

                // Move to next line properly
                currentLine++;

                // Prevent holding the last visible line too long
                if (currentLine >= lines.length) {
                    currentLine = 0; // Restart when reaching the end
                }
            }
        }

        function startTimer() {
            setInterval(displayLine, 2000); // Ensure consistent timing across all lines
        }
    </script>

</body>
</html>
